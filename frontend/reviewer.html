<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrustCart · Reviewer</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script defer src="/static/verification-view.js"></script>
    <script defer src="/static/reviewer.js"></script>
  </head>
  <body class="reviewer-page">
    <nav class="demo-views">
      <a href="/">หน้าลูกค้า / Customer</a
      ><span>หน้าผู้ตรวจสอบ / Reviewer</span>
      <a href="/seller">หน้าผู้ขาย / Seller</a>
    </nav>
    <header class="reviewer-brandbar">
      <div class="container">
        <a href="/">▢ Shopee <small>TrustCart</small></a
        ><span>ศูนย์ตรวจสอบสินค้า</span>
      </div>
    </header>
    <main class="reviewer-shell">
      <header>
        <p class="reviewer-eyebrow">TRUSTCART · REVIEWER</p>
        <h1>รายงานการตรวจสอบสินค้า</h1>
        <p>ตรวจสอบสถานะสินค้าและดูรายการที่ต้องแก้ไข</p>
      </header>
      <section id="demo-reports" hidden>
        <label for="demo-report-select">รายงานสินค้าในรอบนี้</label>
        <select id="demo-report-select">
          <option value="">เลือกสินค้าเพื่อดูผล</option>
        </select>
      </section>
      <form id="report-lookup">
        <label for="report-id">รหัสรายงาน</label>
        <div class="reviewer-lookup">
          <input
            id="report-id"
            name="id"
            required
            autocomplete="off"
            placeholder="วางรหัสรายงานจาก API"
            aria-describedby="lookup-help"
          /><button class="primary" type="submit">เปิดรายงาน</button>
        </div>
        <p id="lookup-help" class="dialog-note">
          เปิดลิงก์ Reviewer จากหน้าลูกค้าเพื่อดูผลล่าสุด หรือใช้รหัสจาก POST
          /v1/verifications
        </p>
      </form>
      <p id="reviewer-error" role="alert" hidden></p>
      <p id="reviewer-loading" role="status" hidden>กำลังโหลดรายงาน…</p>
      <article id="reviewer-report" aria-live="polite"></article>
    </main>
  </body>
</html>
